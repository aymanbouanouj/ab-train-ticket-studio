# Release verification: PNG absence check recognizes the Vite SPA fallback.
# Runs when this workflow file is first added/changed; otherwise manual only.
# Captured images are real Playwright screenshots of synthetic, local demo test runs.
name: Release browser verification and README screenshots

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/e2e-readme-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ab-train-release-docs
  cancel-in-progress: false

jobs:
  verify-and-capture:
    name: Playwright 39-test release verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked packages
        run: npm ci --ignore-scripts
      - name: Install isolated Chromium and required OS libraries
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Run every existing browser test, one worker, unchanged assertions
        run: npx playwright test --workers=1 --reporter=line
        env:
          CI: 'true'
      - name: Select real, synthetic test screenshots
        run: |
          set -euo pipefail
          mkdir -p media/readme
          select_one() {
            local pattern="$1"
            local target="$2"
            mapfile -d '' -t found < <(find test-results -type f -name "$pattern" -print0)
            if (( ${#found[@]} != 1 )); then
              printf 'Expected exactly one %s, found %s\n' "$pattern" "${#found[@]}" >&2
              exit 1
            fi
            cp -- "${found[0]}" "$target"
          }
          select_one desktop-search.png media/readme/desktop-journey.png
          select_one search-390.png media/readme/mobile-journey.png
          select_one desktop-ticket.png media/readme/sample-ticket.png
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from 'node:fs';
          import { PNG } from 'pngjs';
          for (const path of [
            'media/readme/desktop-journey.png',
            'media/readme/mobile-journey.png',
            'media/readme/sample-ticket.png',
          ]) {
            const bytes = readFileSync(path);
            if (bytes.length > 8_000_000 || bytes.length < 15_000) throw new Error('Unexpected screenshot size: ' + path);
            const png = PNG.sync.read(bytes);
            if (png.width < 320 || png.height < 500) throw new Error('Unexpected screenshot dimensions: ' + path);
            console.log(path, png.width, 'x', png.height, statSync(path).size, 'bytes');
          }
          NODE
      - name: Insert screenshot gallery in README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          current = path.read_text(encoding="utf-8")
          marker = "## Try the live experience"
          if current.count(marker) != 1:
              raise SystemExit("README insertion marker unexpected")
          if "media/readme/desktop-journey.png" in current:
              raise SystemExit("Screenshot gallery already exists; refusing to overwrite")
          gallery = """## Screenshots

          Real screenshots captured automatically by Playwright against a local production build using **synthetic demonstration data**.

          **Desktop journey planning**

          ![AB TRAIN desktop journey planner and Moroccan route cards](media/readme/desktop-journey.png)

          <details>
          <summary><strong>Mobile journey planning</strong></summary>

          ![AB TRAIN responsive mobile journey search](media/readme/mobile-journey.png)

          </details>

          <details>
          <summary><strong>Sample ticket with QR code</strong></summary>

          ![AB TRAIN sample booking ticket with QR, not valid for travel](media/readme/sample-ticket.png)

          </details>

          """
          path.write_text(current.replace(marker, gallery + marker), encoding="utf-8")
          PY
      - name: Review exact publication paths and commit screenshots
        run: |
          set -euo pipefail
          git add -- README.md media/readme/desktop-journey.png media/readme/mobile-journey.png media/readme/sample-ticket.png
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only)
          printf 'Reviewed screenshot files:\n%s\n' "${staged[*]}"
          if (( ${#staged[@]} != 4 )); then
            echo 'Unexpected staged file count' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: add tested application screenshots to README [skip ci]'
          git push origin HEAD:main
