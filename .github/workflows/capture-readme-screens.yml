# One-time screenshot curation after all 39 Playwright tests passed in
# https://github.com/aymanbouanouj/ab-train-ticket-studio/actions/runs/40956727928
# The previous documentation step was blocked only by the ignored filename.
name: Capture verified AB TRAIN README screenshots

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-readme-screens.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the site
        run: npm run build
      - name: Run the two screenshot-producing booking tests only
        run: npx playwright test tests/booking.spec.js --workers=1 --reporter=line --grep 'Desktop complete booking|Complete responsive journey at 390px'
        env:
          CI: 'true'
      - name: Select PNG screenshots with synthetic data only
        run: |
          set -euo pipefail
          mkdir -p media/readme
          select_one() {
            local pattern="$1"
            local target="$2"
            mapfile -d '' -t matches < <(find test-results -type f -name "$pattern" -print0)
            if (( ${#matches[@]} != 1 )); then
              printf 'Expected one %s; found %s\n' "$pattern" "${#matches[@]}" >&2
              exit 1
            fi
            cp -- "${matches[0]}" "$target"
          }
          select_one desktop-search.png media/readme/desktop-journey.png
          select_one search-390.png media/readme/mobile-journey.png
          select_one desktop-ticket.png media/readme/ticket-preview.png
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { PNG } from 'pngjs';
          for (const path of [
            'media/readme/desktop-journey.png',
            'media/readme/mobile-journey.png',
            'media/readme/ticket-preview.png',
          ]) {
            const data = readFileSync(path);
            if (data.length < 15_000 || data.length > 8_000_000) throw Error('Unexpected screenshot size: ' + path);
            const png = PNG.sync.read(data);
            if (png.width < 320 || png.height < 500) throw Error('Unexpected screenshot dimensions: ' + path);
            console.log(path + ': ' + png.width + 'x' + png.height);
          }
          NODE
      - name: Add a compact image gallery to README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          original = p.read_text(encoding="utf-8")
          marker = "## Try the live experience"
          if original.count(marker) != 1 or "media/readme/desktop-journey.png" in original:
              raise SystemExit("Unexpected README screenshot-gallery state")
          gallery = """## Screenshots

          Authentic screenshots captured by Playwright against a local production build using **synthetic demo data**.

          **Desktop — journey planner**

          ![AB TRAIN desktop journey planning experience](media/readme/desktop-journey.png)

          <details>
          <summary><strong>Mobile — responsive journey search</strong></summary>

          ![AB TRAIN mobile journey planning experience](media/readme/mobile-journey.png)

          </details>

          <details>
          <summary><strong>Sample ticket and QR</strong></summary>

          ![Sample AB TRAIN ticket with QR; not valid for travel](media/readme/ticket-preview.png)

          </details>

          """
          p.write_text(original.replace(marker, gallery + marker), encoding="utf-8")
          PY
      - name: Commit exactly three vetted screenshots and README
        run: |
          set -euo pipefail
          git add -- README.md media/readme/desktop-journey.png media/readme/mobile-journey.png media/readme/ticket-preview.png
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only)
          printf '%s\n' "${staged[@]}"
          if (( ${#staged[@]} != 4 )); then
            echo 'Unexpected staged path count' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: add authentic desktop mobile and ticket screenshots [skip ci]'
          git push origin HEAD:main
